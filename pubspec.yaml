name: financial_between_us
description: 'A new Flutter project.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.2
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.1.0
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/onboarding/
    - assets/images/auth/
    # Official Google "G" (Google sign-in branding kit), 1x to 4x.
    - assets/icons/
  fonts:
    # Brand typeface: only used by the logo (emblem rim text and wordmark).
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    # Headings. Satoshi (ITF Free Font License) may not be published in a
    # repository, so the file is git-ignored: download it from fontshare.com
    # and place it at assets/fonts/Satoshi-Bold.ttf (see CLAUDE.md).
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
    # Body and amounts (SIL OFL, see assets/fonts/Inter-OFL.txt).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

# Android launcher icon. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/launcher/app_icon_1024.png
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: assets/branding/launcher/adaptive_foreground_1024.png

# Native splash shown while the Flutter engine boots. It is plain black so the
# animated splash (features/splash) starts seamlessly on top of it.
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  android: true
  ios: false
  web: false
  android_12:
    color: "#000000"
    # Android 12+ always shows an icon; this image is fully transparent.
    image: assets/branding/splash/splash_empty.png
    icon_background_color: "#000000"
